name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What you would like to happen. If it changes the pipeline's controls, say how they stay enforced.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install or documentation
        - Mission router
        - Mission Agent (A2/A3 runs)
        - Policy engine
        - New runtime or forge
        - Other
    validations:
      required: true
