name: Bug report
description: Something did not work as the documentation says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this.

        **Security problems:** please do not use this form. Report them privately through the repository's
        **Security** tab → **Report a vulnerability**.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any message from the router or the Mission Agent.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag (for example v0.1.0) or commit you installed.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install or documentation
        - Mission router
        - Mission Agent (A2/A3 runs)
        - Policy engine
        - Other
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - claude-code
        - cursor-cli
        - Not relevant
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant part of the workflow log or PR comment. It is shown as plain text.
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: I removed API keys, private keys, tokens and anything private about my repository from this report.
          required: true
